name: Release

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#release/}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release branch must be named release/vX.Y.Z, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate declared version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.version.outputs.version }}"
          STYLE_VERSION="$(awk -F': *' '/^Version:/ { print $2; exit }' style.css | tr -d '\r')"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$STYLE_VERSION" != "$EXPECTED" ]]; then
            echo "style.css version mismatch: expected $EXPECTED, got $STYLE_VERSION" >&2
            exit 1
          fi

          if [[ "$PACKAGE_VERSION" != "$EXPECTED" ]]; then
            echo "package.json version mismatch: expected $EXPECTED, got $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Lint source
        run: npm run lint

      - name: Build assets
        run: npm run build

      - name: Validate theme.json
        run: python -m json.tool theme.json > /dev/null

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Package installable theme
        run: bash scripts/build-theme-zip.sh

      - name: Verify package contents
        run: bash scripts/verify-theme-package.sh

      - name: Generate checksum
        run: |
          cd build
          sha256sum buildora.zip > buildora.zip.sha256

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build/buildora.zip \
            build/buildora.zip.sha256 \
            --target main \
            --title "Buildora ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
