name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint JavaScript
        run: npm run lint

      - name: Build assets
        run: npm run build

      - name: Validate theme.json
        run: python -m json.tool theme.json > /dev/null

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Package installable theme
        run: bash scripts/build-theme-zip.sh

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildora-theme-${{ github.sha }}
          path: build/buildora.zip
          if-no-files-found: error
