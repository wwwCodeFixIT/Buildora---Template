name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint source
        run: npm run lint

      - name: Check formatting of changed files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              | grep -E '\.(js|scss|json|ya?ml)$' \
              || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "No Prettier-supported files changed."
            exit 0
          fi

          printf 'Checking %s\n' "${files[@]}"
          npx prettier --check "${files[@]}"

      - name: Build assets
        run: npm run build

      - name: Validate theme.json
        run: python -m json.tool theme.json > /dev/null

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Package installable theme
        run: bash scripts/build-theme-zip.sh

      - name: Verify package contents
        run: bash scripts/verify-theme-package.sh

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexora-theme-${{ github.sha }}
          path: build/lexora.zip
          if-no-files-found: error
