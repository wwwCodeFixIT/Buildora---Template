name: PR Preview - Publish

on:
  workflow_run:
    workflows: ['PR Preview - Build']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Identify validated preview bundle
        id: meta
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const artifacts = data.artifacts.filter((artifact) =>
              /^wp-playground-preview-pr\d+-[0-9a-f]+$/i.test(artifact.name)
            );

            if (artifacts.length !== 1) {
              throw new Error(`Expected one Playground preview bundle, found ${artifacts.length}.`);
            }

            const artifact = artifacts[0];
            const match = artifact.name.match(/^wp-playground-preview-pr(\d+)-(.+)$/);

            if (!match) {
              throw new Error(`Cannot parse preview artifact name: ${artifact.name}`);
            }

            const [, prNumber, headSha] = match;
            const expectedSha = context.payload.workflow_run.head_sha;

            if (headSha !== expectedSha) {
              throw new Error(`Artifact SHA ${headSha} does not match workflow SHA ${expectedSha}.`);
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(prNumber),
            });

            if (pullRequest.head.sha !== expectedSha) {
              throw new Error('Pull request head changed before preview publication.');
            }

            core.setOutput('artifact-id', String(artifact.id));
            core.setOutput('pr-number', prNumber);
            core.setOutput('head-sha', headSha);

      - name: Download preview bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.meta.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          gh api -X GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > bundle.zip
          unzip -oq bundle.zip -d bundle
          test -f bundle/zips/buildora.zip
          test -f bundle/blueprint.json

      - name: Publish theme and compact blueprint
        id: publish
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
          HEAD_SHA: ${{ steps.meta.outputs.head-sha }}
        with:
          script: |
            const fs = require('fs');
            const branch = 'playground-artifacts';
            const repository = context.repo;
            const basePath = `pr-${process.env.PR_NUMBER}/${process.env.HEAD_SHA}`;
            const zipPath = 'bundle/zips/buildora.zip';
            const blueprintPath = 'bundle/blueprint.json';

            for (const requiredPath of [zipPath, blueprintPath]) {
              if (!fs.existsSync(requiredPath)) {
                throw new Error(`Preview file not found: ${requiredPath}`);
              }
            }

            try {
              await github.rest.git.getRef({
                owner: repository.owner,
                repo: repository.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;

              const { data: repoData } = await github.rest.repos.get({
                owner: repository.owner,
                repo: repository.repo,
              });
              const { data: baseBranch } = await github.rest.repos.getBranch({
                owner: repository.owner,
                repo: repository.repo,
                branch: repoData.default_branch,
              });

              await github.rest.git.createRef({
                owner: repository.owner,
                repo: repository.repo,
                ref: `refs/heads/${branch}`,
                sha: baseBranch.commit.sha,
              });
            }

            async function upsert(path, content, message) {
              let existingSha;

              try {
                const { data: existing } = await github.rest.repos.getContent({
                  owner: repository.owner,
                  repo: repository.repo,
                  path,
                  ref: branch,
                });
                if (!Array.isArray(existing)) existingSha = existing.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: repository.owner,
                repo: repository.repo,
                path,
                branch,
                message,
                content: Buffer.from(content).toString('base64'),
                ...(existingSha ? { sha: existingSha } : {}),
              });
            }

            const themeRepoPath = `${basePath}/buildora.zip`;
            await upsert(
              themeRepoPath,
              fs.readFileSync(zipPath),
              `ci: publish Buildora preview theme PR #${process.env.PR_NUMBER}`
            );

            const themeUrl = `https://raw.githubusercontent.com/${repository.owner}/${repository.repo}/${branch}/${themeRepoPath}`;
            const blueprintTemplate = fs.readFileSync(blueprintPath, 'utf8');

            if (!blueprintTemplate.includes('__BUILDORA_THEME_URL__')) {
              throw new Error('Blueprint theme URL placeholder is missing.');
            }

            const blueprintJson = blueprintTemplate.replace('__BUILDORA_THEME_URL__', themeUrl);
            JSON.parse(blueprintJson);

            const blueprintRepoPath = `${basePath}/blueprint.json`;
            await upsert(
              blueprintRepoPath,
              blueprintJson,
              `ci: publish Buildora preview blueprint PR #${process.env.PR_NUMBER}`
            );

            const blueprintUrl = `https://raw.githubusercontent.com/${repository.owner}/${repository.repo}/${branch}/${blueprintRepoPath}`;
            core.setOutput('theme-url', themeUrl);
            core.setOutput('blueprint-url', blueprintUrl);
            core.info(`Published preview theme: ${themeUrl}`);
            core.info(`Published preview blueprint: ${blueprintUrl}`);

      - name: Publish Playground button
        uses: WordPress/action-wp-playground-pr-preview@43fc435558bc6cee69f5b214d6b8ca4f9f80c31d # v3
        with:
          mode: append-to-description
          playground-host: 'https://playground.wordpress.net/?storage=temp'
          blueprint-url: ${{ steps.publish.outputs.blueprint-url }}
          pr-number: ${{ steps.meta.outputs.pr-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
